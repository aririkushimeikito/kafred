# Deploys the static site to Bluehost (kafredlapida.com) over FTPS whenever
# main changes, or on demand from the Actions tab.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   FTP_SERVER     e.g. ftp.kafredlapida.com  (or the server shown in Bluehost -> Advanced -> FTP Accounts)
#   FTP_USERNAME   the FTP account user, e.g. deploy@kafredlapida.com
#   FTP_PASSWORD   that account's password
# Optional repository *variable* (not secret):
#   FTP_SERVER_DIR remote folder relative to the FTP account's home. Default "./",
#                  which is right for a dedicated FTP account whose directory IS the
#                  site's document root. If you log in with the main cPanel user
#                  instead, set it to "public_html/" (or the addon domain's root).
#
# Until the secrets exist the workflow finishes successfully with a notice
# instead of failing, so merges to main are never blocked.

name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check that FTP secrets are configured
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bluehost deploy skipped::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to enable automatic deployment (see DEPLOYMENT.md, section 1)."
          fi

      - name: Upload site to Bluehost over FTPS
        if: steps.check.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            dist/**
            README.md
            DEPLOYMENT.md
            .gitignore
            .nojekyll

      - name: Verify the live site serves this deployment
        if: steps.check.outputs.configured == 'true'
        run: |
          set +e
          echo "== Fresh fetch of https://kafredlapida.com/contact/ (bypassing caches) =="
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
               -o /tmp/live-contact.html -D /tmp/live-headers.txt "https://kafredlapida.com/contact/?nocache=$(date +%s)"
          echo "-- response headers --"; grep -iE '^(HTTP/|last-modified|cache-control|server|location)' /tmp/live-headers.txt
          echo "-- page checks --"
          grep -o '<title>[^<]*</title>' /tmp/live-contact.html | head -1
          grep -oE '>(Submit|Send|Prepare) Inquiry<' /tmp/live-contact.html | head -1 || echo "button text not found"
          grep -c 'data-endpoint="send.php"' /tmp/live-contact.html | sed 's/^/send.php wired: /'
          echo "-- local copy for comparison --"
          grep -oE '>(Submit|Send|Prepare) Inquiry<' contact/index.html | head -1
          echo "== Mailer endpoint (expects HTTP 405 JSON for GET) =="
          curl -sS --max-time 30 -H 'Accept: application/json' -w ' [HTTP %{http_code}]\n' "https://kafredlapida.com/contact/send.php"
          echo "== Root page title =="
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "https://kafredlapida.com/?nocache=$(date +%s)" | grep -o '<title>[^<]*</title>' | head -1
          echo "== HTTP -> HTTPS and www redirects =="
          curl -sS -I --max-time 30 "http://kafredlapida.com/about/index.html" | grep -iE '^(HTTP/|location)'
          curl -sS -I --max-time 30 "http://www.kafredlapida.com/" | grep -iE '^(HTTP/|location)'
          true

      - name: Summary
        if: steps.check.outputs.configured == 'true'
        run: echo "Deployed commit ${GITHUB_SHA::7} to https://kafredlapida.com/" >> "$GITHUB_STEP_SUMMARY"
