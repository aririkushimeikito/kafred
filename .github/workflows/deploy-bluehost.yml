# Deploys the static site to Bluehost (kafredlapida.com) over FTPS whenever
# main changes, or on demand from the Actions tab.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   FTP_SERVER     e.g. ftp.kafredlapida.com  (or the server shown in Bluehost -> Advanced -> FTP Accounts)
#   FTP_USERNAME   the FTP account user, e.g. deploy@kafredlapida.com
#   FTP_PASSWORD   that account's password
# Optional repository *variable* (not secret):
#   FTP_SERVER_DIR the remote folder, default "public_html/" (use the addon domain's
#                  document root if kafredlapida.com is not the primary domain)
#
# Until the secrets exist the workflow finishes successfully with a notice
# instead of failing, so merges to main are never blocked.

name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check that FTP secrets are configured
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bluehost deploy skipped::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to enable automatic deployment (see DEPLOYMENT.md, section 1)."
          fi

      - name: Upload site to Bluehost over FTPS
        if: steps.check.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            dist/**
            README.md
            DEPLOYMENT.md
            .gitignore
            .nojekyll

      - name: Summary
        if: steps.check.outputs.configured == 'true'
        run: echo "Deployed commit ${GITHUB_SHA::7} to https://kafredlapida.com/" >> "$GITHUB_STEP_SUMMARY"
