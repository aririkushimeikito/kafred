# Deploys the static site to Bluehost (kafredlapida.com) over FTPS whenever
# main changes, or on demand from the Actions tab.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   FTP_SERVER     e.g. ftp.kafredlapida.com  (or the server shown in Bluehost -> Advanced -> FTP Accounts)
#   FTP_USERNAME   the FTP account user, e.g. deploy@kafredlapida.com
#   FTP_PASSWORD   that account's password
# Optional repository *variable* (not secret):
#   FTP_SERVER_DIR remote folder relative to the FTP account's home. Default "./",
#                  which is right for a dedicated FTP account whose directory IS the
#                  site's document root. If you log in with the main cPanel user
#                  instead, set it to "public_html/" (or the addon domain's root).
#
# Until the secrets exist the workflow finishes successfully with a notice
# instead of failing, so merges to main are never blocked.

name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check that FTP secrets are configured
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bluehost deploy skipped::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to enable automatic deployment (see DEPLOYMENT.md, section 1)."
          fi

      - name: Upload site to Bluehost over FTPS
        if: steps.check.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            dist/**
            README.md
            DEPLOYMENT.md
            .gitignore
            .nojekyll

      - name: Verify what is on the server (direct FTPS read, bypasses CDN caches)
        if: steps.check.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          set +e
          base="ftp://${FTP_SERVER}/${FTP_DIR#./}"
          fetch() { curl -sS --ssl-reqd --max-time 60 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "$base$1"; }
          echo "== Files in the site root on the server =="
          fetch "" | awk '{print $NF}' | tr '\n' ' '; echo
          echo "== Contact page on the server =="
          fetch "contact/index.html" > /tmp/srv-contact.html
          grep -oE '>(Submit|Send|Prepare) Inquiry<' /tmp/srv-contact.html | head -1 || echo "button text not found"
          grep -c 'data-endpoint="send.php"' /tmp/srv-contact.html | sed 's/^/send.php wired: /'
          echo "== Mailer present on the server =="
          fetch "contact/send.php" | grep -oE "const (RECIPIENT|SUBJECT) += '[^']*'" 
          echo "== .htaccess on the server (cache rule) =="
          fetch ".htaccess" | grep -E 'text/html|html\|php' 
          echo "== Local copy for comparison =="
          grep -oE '>(Submit|Send|Prepare) Inquiry<' contact/index.html | head -1

      - name: Check the public URL (informational; a CDN bot challenge may hide the real page)
        if: steps.check.outputs.configured == 'true'
        run: |
          set +e
          body=$(curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' -D /tmp/h.txt "https://kafredlapida.com/contact/?nocache=$(date +%s)")
          if echo "$body" | grep -q 'Just a moment'; then
            echo "::notice title=Public check skipped::kafredlapida.com is behind a Cloudflare bot challenge, so automated fetches cannot see the real page. Check in a browser; if an old page shows, purge the site cache in Bluehost."
            grep -iE '^(HTTP/|server|cf-cache-status|cache-control|age)' /tmp/h.txt
          else
            grep -iE '^(HTTP/|server|cf-cache-status|cache-control|age|last-modified)' /tmp/h.txt
            echo "$body" | grep -oE '>(Submit|Send|Prepare) Inquiry<' | head -1
          fi
          true

      - name: Summary
        if: steps.check.outputs.configured == 'true'
        run: echo "Deployed commit ${GITHUB_SHA::7} to https://kafredlapida.com/" >> "$GITHUB_STEP_SUMMARY"
